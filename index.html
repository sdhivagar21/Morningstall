<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<title>Morning Stall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{--cream:#FFF8EC;--green:#173D30;--mango:#FFC857;--ink:#15241D;--muted:#53625A;--line:#EADFC8;--head:#F6EEDC;--gain:#1B7447;--loss:#B03B27;--oat:#D9962B;--toast:#8A5528;--other:#8E9A93;--hf:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--bf:"DM Sans",ui-sans-serif,system-ui,sans-serif;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--sh:0 1px 0 var(--line),0 12px 28px -20px rgba(23,61,48,.5)}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font:16px/1.45 var(--bf);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}img{display:block}a{color:inherit}
h1,h2,h3{font-family:var(--hf);letter-spacing:-.02em;line-height:1.1;color:var(--green)}
b,input,td,.n{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.pos{color:var(--gain)}.neg{color:var(--loss)}
.btn{min-height:54px;padding:0 20px;border-radius:16px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background-color .15s}
.btn:active{transform:scale(.98)}.primary{background:var(--green);color:var(--cream)}.secondary{color:var(--green);box-shadow:inset 0 0 0 2px var(--green);background:#fff}
.btn[aria-disabled=true]{background:#E2DACB;color:#5E6A63;cursor:not-allowed}
.quiet{color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;min-height:44px;padding:0 6px;border-radius:10px}
.icon-btn{min-width:44px;min-height:44px;display:inline-grid;place-items:center;color:var(--muted);border-radius:12px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#FBE3DC;color:#7C2414;font-size:15px}.alert svg{flex:none;margin-top:1px}
/* photos */
.thumb{--s:44px;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 50% 35%,#FFE3A0,var(--mango) 72%);display:grid;place-items:center;flex:none}
.thumb img{filter:drop-shadow(0 5px 4px rgba(90,55,0,.28));pointer-events:none;max-width:none}
img.io{height:calc(var(--s)*1.18);width:auto;transform:translateY(-8%)}img.is{width:calc(var(--s)*1.1);height:auto;transform:translate(-4%,9%)}
/* login */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.lg-photo{height:34vh;min-height:190px;max-height:360px;overflow:hidden;background:#C9A777}.lg-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.lg-card{position:relative;background:var(--cream);border-radius:28px 28px 0 0;margin-top:-28px;padding:26px 20px calc(28px + var(--sb));width:100%;max-width:460px;align-self:center;flex:1}
.lg-cut{position:absolute;right:12px;top:-58px;width:132px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
.brand{font:800 19px var(--hf);color:var(--green);letter-spacing:-.01em;white-space:nowrap}
.lg-card h1{font-size:clamp(27px,7.4vw,38px);margin:8px 0 22px;max-width:15ch}
.lg-card h1 span{color:var(--ink);background:linear-gradient(transparent 64%,var(--mango) 64%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lg-card form{display:grid;gap:14px}.lg-card .btn{width:100%}
.field{display:grid;gap:6px;font-weight:700;font-size:15px}
.field input,.inp{height:52px;border-radius:14px;border:2px solid #D9CCB1;background:#fff;padding:0 14px;font-size:17px;font-weight:500;width:100%;min-width:0}
.field input:focus,.inp:focus,.money:focus-within{border-color:var(--green)}
.demo{margin-top:22px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}.demo summary{cursor:pointer;font-weight:700;color:var(--green);min-height:44px;display:flex;align-items:center}.demo p{margin:4px 0}
@media(min-width:880px){.login{flex-direction:row}.lg-photo{flex:1.1;height:auto;max-height:none;min-height:100dvh}.lg-card{margin:0;border-radius:0;align-self:center;padding:48px 56px;max-width:540px;flex:1}.lg-cut{top:-24px;right:48px}}
/* shell */
.hdr{position:sticky;top:0;z-index:10;background:rgba(255,248,236,.96);border-bottom:1px solid var(--line);padding-top:var(--st)}
.hdr-in{max-width:1040px;margin:0 auto;padding:6px 8px 0 16px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand right" "tabs tabs";align-items:center;column-gap:8px}
.hdr .brand{grid-area:brand}.hdr-r{grid-area:right;display:flex;align-items:center;gap:2px}
.tabs{grid-area:tabs;display:flex;gap:4px}
.tabs a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;font-weight:700;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent}
.tabs a[aria-current=page]{color:var(--green);border-bottom-color:var(--green)}
.who{font-size:14px;font-weight:700;color:var(--muted);padding:0 4px}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.sync.ok{color:var(--gain);background:#E2F1E7}.sync.busy{color:var(--muted);background:var(--head)}.sync.err{color:#7C2414;background:#FBE3DC;min-height:36px}
@media(min-width:760px){.hdr-in{grid-template-columns:auto 1fr auto;grid-template-areas:"brand tabs right";padding:4px 12px 0 20px}.tabs{justify-content:center}.tabs a{flex:none;padding:0 18px}}
.main{width:100%;max-width:1040px;margin:0 auto;padding:18px 16px calc(32px + var(--sb));display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.main>*{min-width:0}
.intro h1{font-size:clamp(26px,7.4vw,38px);font-weight:800}.intro p{margin-top:4px}
.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh)}.panel>h2{font-size:24px}
h3{font-size:18px;margin:22px 0 10px}h3 span{font:500 14px var(--bf);color:var(--muted);letter-spacing:0}
/* today strip */
.today{background:var(--green);color:var(--cream);border-radius:20px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;position:relative;overflow:hidden}
.today::before{content:"";position:absolute;width:200px;height:200px;right:-70px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,87,.45),rgba(255,200,87,0) 68%)}
.today .lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,248,236,.85)}
.today .big{font:700 40px/1.05 var(--bf);letter-spacing:-.03em;color:var(--mango)}.today .big.neg{color:#FFB3A1}.today .big.none{font-size:22px;color:var(--cream)}
.today .mini{display:flex;gap:16px;font-size:15px;color:rgba(255,248,236,.9);position:relative}.today .mini b{font-size:20px;color:var(--cream);display:block;line-height:1.1}
/* sheet */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end;max-width:440px}
.tools .field{font-size:14px}.tools select,.tools input{height:48px;border-radius:12px;border:2px solid #D9CCB1;background:#fff;padding:0 8px;font-size:15px;font-weight:600;width:100%;min-width:0}
.sheet{position:relative;overflow-x:auto;background:#fff;box-shadow:var(--sh);margin:0 -16px;scroll-padding-left:94px;overscroll-behavior-x:contain}
.grid{border-collapse:separate;border-spacing:0;min-width:100%;font-size:15px}
.grid th,.grid td{border-bottom:1px solid #E3D7BF;border-right:1px solid #E3D7BF;white-space:nowrap;text-align:right;padding:0}
.grid thead th{background:var(--head);color:var(--green);font-weight:700;font-size:13px;padding:8px 10px}
.grid thead .grp{text-align:center;font-size:14px}.grp span{display:inline-flex;align-items:center;gap:6px}.grp .thumb{--s:26px}
.grid .sc{position:sticky;left:0;z-index:1;background:#fff;text-align:left;padding:4px 8px 4px 10px;width:94px;min-width:94px;font-weight:500;border-right:2px solid var(--line);line-height:1.15}
.grid thead .sc{background:var(--head);z-index:2}.sc b{font-size:16px}.sc small{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.sc em{display:block;font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--toast)}.sc em.miss{color:var(--loss)}
.mrow th{background:var(--cream)!important;text-align:left!important;padding:8px 10px!important;font:800 15px var(--hf)!important;color:var(--green)}
.m.in{padding:0!important}.pc{width:100%;min-width:96px}.pf.in.pos .pc{color:var(--gain)}.pf.in.neg .pc{color:var(--loss)}
.grid td.calc{background:#F7F0E1}.grid tfoot td,.grid tfoot th{background:var(--head)}
.grid thead .prow2 th,.prow2 td{background:#FFFBF2!important;padding:6px 8px!important;text-align:left!important;font-weight:700;color:var(--green)}
.pin{display:inline-flex;align-items:center;font-weight:700;color:var(--green);border:2px solid #D9CCB1;border-radius:10px;background:#fff;padding-left:10px;height:42px}.pin:focus-within{border-color:var(--green)}
.pin input{width:54px;height:38px;border:0;background:none;font-size:17px;font-weight:700;color:var(--green);padding:0 6px}.pin input:focus-visible{outline:none}
.pnote{font-size:13px;font-weight:500!important;color:var(--muted)!important;white-space:normal!important}
.status{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}.status b{color:var(--ink)}.status b.pos{color:var(--gain)}.status b.neg{color:var(--loss)}.status .miss,.status .miss b{color:var(--loss)}.status .done{color:var(--gain);font-weight:700}
.cell{width:64px;height:50px;border:0;background:transparent;text-align:right;padding:0 10px;font-size:18px;font-weight:700;color:var(--green);border-radius:0}
.cell::placeholder{color:#CBBFA9;font-weight:500}.cell:focus-visible{outline:none}
.cell:focus{box-shadow:inset 0 0 0 3px var(--green);background:#FFFDF5}
.cell[aria-invalid=true]{background:#FBE3DC;color:var(--loss);box-shadow:inset 0 0 0 2px var(--loss)}
.m{padding:0 12px!important;min-width:86px;font-weight:500;color:var(--muted)}.m.pf{font-weight:700}
.is-today td,.is-today .sc{background:#FFF5D6}.grid .is-today td.calc{background:#F6E8BF}
.grid tfoot th,.grid tfoot td{background:var(--head);font-weight:800;padding:12px 10px;border-bottom:0;color:var(--green)}.grid tfoot .m{color:var(--green)}
.x{width:46px;text-align:center!important}
.lv-btn{display:block;margin:4px 0 2px;min-height:34px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;color:var(--green);background:#fff;box-shadow:inset 0 0 0 1.5px #D9CCB1}.lv-btn:hover{box-shadow:inset 0 0 0 1.5px var(--green)}
.sc em.lv{color:var(--muted)}
.grid td.lvcell{text-align:left;padding:0 6px 0 14px;color:var(--muted);font-weight:700;background:repeating-linear-gradient(-45deg,#F7F0E1 0 10px,#FBF6EA 10px 20px)}
.lvcell span{margin-right:10px}.lvcell .quiet{font-size:14px}.is-today td.lvcell{background:repeating-linear-gradient(-45deg,#F6E8BF 0 10px,#FFF5D6 10px 20px)}.del{width:44px;height:44px;border-radius:10px;color:var(--muted);display:inline-grid;place-items:center}
.empty-row{text-align:center!important;padding:28px 16px!important;color:var(--muted);white-space:normal!important}
.hint{font-size:14px;color:var(--muted)}
@media(min-width:760px){.sheet{margin:0;border-radius:18px}}
/* dashboard */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{min-height:46px;padding:0 16px;border-radius:99px;box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:15px;color:var(--green);background:#fff}
.chip[aria-pressed=true]{background:var(--green);color:var(--cream);box-shadow:none}
.pr{display:grid;grid-template-columns:48px 1fr;gap:4px 12px;padding:14px 0;align-items:start}.pr+.pr{border-top:1px solid var(--line)}
.pr .thumb{--s:48px;grid-row:span 3}.pn{font-weight:700;font-size:17px}
.pr-in{display:flex;flex-wrap:wrap;gap:8px 12px}.pr-in label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.money{display:flex;align-items:center;height:48px;border:2px solid #D9CCB1;border-radius:12px;background:#fff;padding-left:12px;font-weight:700;color:var(--green)}
.money input{width:72px;height:44px;border:0;background:none;padding:0 8px 0 4px;font-size:18px;font-weight:700;color:var(--green)}.money input:focus-visible{outline:none}
.pu{font-size:14px;color:var(--muted)}.pu.bad{color:var(--loss);font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.ir{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;padding:10px 0}.ir+.ir{border-top:1px solid var(--line)}
.ir .thumb,.ir .ico{grid-row:span 2}.ir .amt{font-weight:700;font-size:18px;color:var(--green);text-align:right}
.ir .sub{font-size:14px;color:var(--muted)}.ir .bar{grid-column:2/-1}
.bar{height:8px;border-radius:9px;background:var(--head);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.ico{--s:44px;width:44px;height:44px;border-radius:50%;background:var(--head);display:grid;place-items:center;color:var(--muted)}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--green);margin-top:6px;padding-top:12px;font-weight:700;color:var(--green)}.tot b{font-size:22px}
.addc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}.addc .wide{grid-column:1/-1}.addc .money{height:52px}.addc .money input{width:100%}
.addc .btn{grid-column:1/-1}.ferr{grid-column:1/-1;color:var(--loss);font-size:14px;font-weight:700}
.cl{list-style:none;margin-top:12px}.cl li{display:grid;grid-template-columns:1fr auto 44px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cl .d{font-size:13px;color:var(--muted);display:block}.cl b{color:var(--green)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--cream);border-radius:16px;padding:14px}.kpi span{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-size:clamp(22px,6.4vw,30px);line-height:1.15;color:var(--green);letter-spacing:-.02em}.kpi small{font-size:13px;color:var(--muted)}
.kpi.hl{background:var(--green)}.kpi.hl span,.kpi.hl small{color:rgba(255,248,236,.85)}.kpi.hl b{color:var(--mango)}.kpi.hl.lossk b{color:#FFB3A1}
.pk{background:var(--cream);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:12px}.pk span{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pkf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:12px}.pkf .money{height:52px}.pkf .money input{width:110px}.pkf .btn{min-height:52px}
.pk b{display:block;font:700 clamp(34px,10vw,46px)/1.1 var(--bf);letter-spacing:-.03em;color:var(--green);margin:4px 0 6px}.pk b.neg{color:var(--loss)}.pk small{font-size:14px;color:var(--muted)}
.big-p{background:var(--green);color:var(--cream);border-radius:18px;padding:18px;margin-top:12px}.big-p span{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,248,236,.85)}
.big-p b{display:block;font:700 clamp(40px,12vw,56px)/1.05 var(--bf);letter-spacing:-.03em;color:var(--mango);margin:4px 0 6px}.big-p.neg b{color:#FFB3A1}.big-p small{font-size:14px;color:rgba(255,248,236,.9)}
.kpis2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bw{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.bw li{background:var(--cream);border-radius:14px;padding:12px 14px}.bw span{display:block;font-size:13px;font-weight:700;color:var(--muted)}.bw b{display:block;font-size:22px}.bw small{font-size:13px;color:var(--muted)}
.flow{display:grid;gap:12px;margin-top:4px}.fl{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;align-items:center}
.fl>span{font-weight:700;font-size:14px}.fl>b{grid-column:2;font-size:15px;color:var(--green)}
.stack{display:flex;height:28px;border-radius:8px;overflow:hidden;background:var(--head)}.stack i{height:100%}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-top:4px}.legend li{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.verdict{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:600}.verdict.pos{background:#E2F1E7;color:#14502F}.verdict.neg{background:#FBE3DC;color:#7C2414}
#daily{min-height:200px;overflow:hidden}#daily svg{display:block}
.b-pos{fill:var(--gain)}.b-neg{fill:var(--loss)}.v{font:700 11px var(--bf);text-anchor:middle}.t-pos{fill:var(--gain)}.t-neg{fill:var(--loss)}
.dl{font:500 11px var(--bf);fill:var(--muted);text-anchor:middle}.zero{stroke:var(--ink);stroke-width:1.5}.z{font:700 11px var(--bf);fill:var(--muted)}
.items{display:grid;gap:12px}.it{border:1px solid var(--line);border-radius:16px;padding:14px}.it-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.it dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}.it dt{color:var(--muted)}.it dd{font-weight:700;text-align:right}
.st{margin-top:10px;font-size:14px;color:var(--muted)}.st .bar{margin-top:6px}
.facts{list-style:none;display:grid;gap:8px}.facts li{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border-radius:14px;padding:12px 14px}.facts svg{flex:none;color:var(--toast);margin-top:2px}
.empty{text-align:center;display:grid;justify-items:center;gap:8px;padding:24px 8px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}.items{grid-template-columns:1fr 1fr}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}.addc{grid-template-columns:2fr 1fr 1fr auto}.addc .wide,.addc .btn{grid-column:auto}}
#toast{position:fixed;left:0;right:0;bottom:calc(20px + var(--sb));display:flex;justify-content:center;pointer-events:none;z-index:20;padding:0 16px}
.toast-in{pointer-events:auto;background:var(--ink);color:var(--cream);border-radius:14px;padding:6px 6px 6px 16px;display:flex;gap:10px;align-items:center;max-width:480px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);font-size:15px;animation:rise .2s ease-out}
.toast-in .quiet{color:var(--mango)}.toast-in :focus-visible{outline-color:var(--mango)}
.sk{border-radius:18px;background:linear-gradient(90deg,#F0E6D2 25%,#F8F1E3 50%,#F0E6D2 75%) 0 0/200% 100%;animation:shim 1.2s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes shim{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=()=>iso(new Date()),addDays=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return iso(d)};
const fmtDate=(s,o)=>new Date(s+"T12:00").toLocaleDateString("en-IN",o);
const monthName=m=>new Date(m+"-01T12:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
const rs=n=>"₹"+Math.abs(Math.round(n)).toLocaleString("en-IN");
const money=n=>(n<0?"−":"")+rs(n);
const pct=(a,b)=>b?Math.round(a/b*100):0;

const newDay=prices=>({...Object.fromEntries(P.map(p=>[p.id,{made:0,sold:0}])),prices:clone(prices)});
/* every change is a small named operation, applied to the screen at once and then sent to the server,

const OPS={
  setCell(db,d,k,f,v){(db.days[d]||(db.days[d]=newDay(db.prices)))[k][f]=v},
  setProfit(db,d,v){const x=db.days[d]||(db.days[d]=newDay(db.prices));if(v==null)delete x.profit;else x.profit=v},
  setCost(db,d,v){const x=db.days[d]||(db.days[d]=newDay(db.prices));if(v==null)delete x.cost;else x.cost=v},

/* ---------- server ---------- */
const API={
  async req(path,o={}){let r;
    try{r=await fetch("/api/"+path,{cache:"no-store",keepalive:o.method==="POST"&&path==="ops",...o,
      headers:{"content-type":"application/json",...(S.session?.token?{authorization:"Bearer "+S.session.token}:{})}})}
    catch(e){const x=new Error("offline");x.status=0;throw x}
    let b=null;try{b=await r.json()}catch(e){}
    if(!r.ok||!b){const x=new Error(b?.error||"HTTP "+r.status);x.status=r.ok?502:r.status;throw x}return b},
  login:(u,p)=>API.req("login",{method:"POST",body:JSON.stringify({u,p})}),
  load:rev=>API.req("stall"+(rev!=null?"?rev="+rev:"")),
  send:ops=>API.req("ops",{method:"POST",body:JSON.stringify({ops})})};
let D=null,REV=null,SEQ=0,inflight=0;const pend=[],timers={};
/* a change only goes to the screen and the server; nothing is kept in this browser any more */
function run(op,args,key){OPS[op](D,...args);SEQ++;sync("busy");
  /* a newer value for the same box replaces any older one still waiting to be resent */
  const send=async()=>{if(key){delete timers[key];for(let i=pend.length;i--;)if(pend[i][2]===key)pend.splice(i,1)}
    inflight++;try{await API.send([[op,args]])}catch(e){failed(e,[[op,args,key]])}finally{inflight--;settle()}};
  if(key){clearTimeout(timers[key]?.t);timers[key]={t:setTimeout(send,350),send}}else send()}
function settle(){if(!inflight&&!Object.keys(timers).length){sync(pend.length?"err":"ok");if(refused)setTimeout(poll,50)}}
let refused=false;
function failed(e,ops){if(e.status===401)return expired();
  /* the server refused the change: show what the server has instead of keeping a number nobody else sees */
  if(e.status===400){refused=true;toast("That change couldn’t be saved, so the sheet was refreshed.",5000);return}
  pend.push(...ops)}
/* write any waiting change straight away when the page is hidden, closed or logged out */
function flush(){Object.values(timers).forEach(x=>{clearTimeout(x.t);x.send()})}
addEventListener("pagehide",flush);
async function retry(){if(!pend.length||inflight)return;const q=pend.splice(0);sync("busy");inflight++;
  try{await API.send(q.map(([op,args])=>[op,args]))}catch(e){failed(e,q)}finally{inflight--;settle()}}
function expired(){Object.values(timers).forEach(x=>clearTimeout(x.t));for(const k in timers)delete timers[k];pend.length=0;
  store.del(K.session);S.session=null;D=null;REV=null;go();toast("Please sign in again.",5000)}
/* pick up the other person's changes: cheap check every few seconds while the page is open */
let pollT=null,polling=false;
function startPoll(){clearInterval(pollT);pollT=setInterval(()=>{if(!document.hidden)poll()},POLL_MS)}
function busy(){return pend.length||inflight||Object.keys(timers).length}
async function poll(){if(!S.session||!D||polling)return;if(pend.length)return retry();if(busy())return;
  const force=refused,seq=SEQ;polling=true;
  try{const r=await API.load(force?null:REV);if(r.same||!S.session)return;
    /* skip if something was typed while we were asking, or a box is being edited: try again next round */
    if(seq!==SEQ||busy()||(!force&&document.activeElement?.matches?.("input,select,textarea")))return;
    refused=false;const nd=migrate(r.db),changed=JSON.stringify(nd)!==JSON.stringify(D);REV=r.rev;D=nd;if(changed)refresh()}
  catch(e){if(e.status===401)expired()}finally{polling=false}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush();else poll()});
addEventListener("online",()=>poll());
function refresh(){if(!$("#main"))return;const sh=$(".sheet"),x=sh?.scrollLeft||0,y=sh?.scrollTop||0;
  S.page==="home"?renderHome():$("#ana")?fillDash():renderDash();const s2=$(".sheet");if(s2){s2.scrollLeft=x;s2.scrollTop=y}}
/* numbers typed before the shared sheet existed are still in this browser: add the days the server doesn't have yet, once */
async function moveLocal(){if(store.get(K.moved,false))return;const old=store.get(K.old,null);if(!old||!old.days){store.set(K.moved,true);return}
  migrate(old);const ops=[],t=TODAY(),filled=day=>day&&!calcDay(day).empty;
  for(const[d,day]of Object.entries(old.days))if(d>=START&&d<=t&&filled(day)&&!filled(D.days[d]))ops.push(["putDay",[d,clone(day)]]);
  for(const e of old.expenses||[])if(!D.expenses.some(x=>x.id===e.id))ops.push(["addCost",[clone(e)]]);
  const def=JSON.stringify(DEF_PRICES);
  if(old.prices&&JSON.stringify(D.prices)===def)for(const p of P){const v=old.prices[p.id]?.price;if(typeof v==="number"&&v!==DEF_PRICES[p.id].price)ops.push(["setPrice",[p.id,"price",v,t]])}
  if(!ops.length){store.set(K.moved,true);return}
  try{inflight++;await API.send(ops);ops.forEach(([op,args])=>OPS[op](D,...args));D=migrate(D);store.set(K.moved,true);SEQ++;refresh();
    const n=ops.filter(o=>o[0]==="putDay").length;toast(`Added ${n?pl(n,"day"):"your entries"} saved on this device to the shared sheet.`,6000)}
  catch(e){/* try again next time the page opens */}finally{inflight--}}
function sync(s){const el=$("#sync");if(!el)return;el.className="sync "+s;
  el.innerHTML=s==="ok"?ICON.tick+"Saved":s==="busy"?'<span class="spin"></span>Saving…':`<button class="quiet" data-act="retry" style="min-height:32px;color:inherit">Not saved · Retry</button>`}

/* ---------- money maths ---------- */
function calcDay(day){const pr=day.prices||D.prices,by={};let rev=0,made=0,sold=0;
  for(const p of P){const x=day[p.id]||{made:0,sold:0},r=x.sold*(pr[p.id]?.price??D.prices[p.id].price);by[p.id]={made:x.made,sold:x.sold,rev:r};rev+=r;made+=x.made;sold+=x.sold}
  const hasCost=typeof day.cost==="number",cost=hasCost?day.cost:0,counted=made>0||sold>0,data=counted||hasCost,manual=!data&&typeof day.profit==="number";
  /* leave = stall closed, nobody available; numbers typed for the day win over the leave mark */
  const leave=!data&&!manual&&day.leave===true;
  return{rev,cost,hasCost,profit:data?rev-cost:manual?day.profit:0,made,sold,by,counted,data,manual,leave,empty:!data&&!manual&&!leave}}
function periodRange(per){const t=TODAY(),cap=d=>d<START?START:d;if(per==="month")return[cap(t.slice(0,8)+"01"),t];if(per==="d30")return[cap(addDays(t,-29)),t];return[START,t]}
function analyse(r){const items=Object.fromEntries(P.map(p=>[p.id,{made:0,sold:0,rev:0}]));let rev=0,dcost=0,made=0,sold=0,manual=0,cdays=0;const daily=[],mdays=[],missing=[],nocost=[],leaves=[];
  for(let d=r[0];d<=r[1];d=addDays(d,1)){const day=D.days[d],c=day&&calcDay(day);if(c&&c.leave){leaves.push(d);continue}if(!c||c.empty){missing.push(d);continue}
    if(c.manual){manual+=c.profit;mdays.push(d)}else{cdays++;P.forEach(p=>{const a=items[p.id],b=c.by[p.id];a.made+=b.made;a.sold+=b.sold;a.rev+=b.rev});rev+=c.rev;dcost+=c.cost;made+=c.made;sold+=c.sold;if(c.rev>0&&!c.hasCost)nocost.push(d)}

  return{daily,items,rev,dcost,other,ex,invested:dcost+other,net:rev-dcost+manual-other,made,sold,manual,mdays,missing,nocost,cdays,leaves}}

/* in pocket = daily profit added up (sales − that day's cost) − other costs.
   Once cash has been counted (pocketFix), it starts from that amount: profit and other costs already on that day were in

const profitFrom=d=>{const a=analyse([d,TODAY()]);return a.rev-a.dcost+a.manual};
const otherFrom=d=>D.expenses.reduce((a,e)=>e.date>=d&&e.date<=TODAY()?a+e.amount:a,0);
function pocket(){const f=D.pocketFix;if(!f){const p=profitFrom(START),c=otherFrom(START);return{v:p-c,p,c}}
  /* counts saved before other costs were taken off: treat that day's other costs as already in the count */
  const ob=f.ob??D.expenses.reduce((a,e)=>e.date===f.date?a+e.amount:a,0),p=profitFrom(f.date)-f.base,c=otherFrom(f.date)-ob;return{v:f.amount+p-c,f,p,c}}

  el.innerHTML=`<div class="pk"><span>${f?`Since counting on ${fmtDate(f.date,o)}`:`All time · since ${fmtDate(START,o)}`}</span><b class="${v<0?"neg":""}">${money(v)}</b>

  el.innerHTML=`<form id="pkf" class="pkf" novalidate><label class="field">Cash in pocket now<span class="money">₹<input name="v" inputmode="numeric" maxlength="6" autocomplete="off" value="${Math.max(0,pocket().v)}"></span></label>

  const i=el.querySelector("input");i.focus();i.select()}
function fillDash(){fillPocket();const r=periodRange(S.per),a=analyse(r),same=r[0]===r[1],o={day:"numeric",month:"short",year:"numeric"};
  $("#per-l").textContent=`${same?fmtDate(r[0],o):`${fmtDate(r[0],o)} – ${fmtDate(r[1],o)}`} · ${a.daily.length} filled · ${a.missing.length} not filled${a.leaves.length?` · ${pl(a.leaves.length,"leave day")}`:""}`;
  const max=Math.max(a.invested,1);
  $("#inv").innerHTML=`<div class="ir"><span class="ico">${ICON.grid}</span><span class="pn" style="font-size:16px">Daily costs</span><span class="amt">${rs(a.dcost)}</span><span class="sub">Saved on Home earlier</span><span class="sub" style="text-align:right">${pct(a.dcost,a.invested)}%</span><div class="bar"><i style="width:${a.dcost/max*100}%;background:var(--toast)"></i></div></div>
   <div class="ir"><span class="ico">${ICON.bag}</span><span class="pn" style="font-size:16px">Other costs</span><span class="amt">${rs(a.other)}</span><span class="sub">${pl(a.ex.length,"item")}</span><span class="sub" style="text-align:right">${pct(a.other,a.invested)}%</span><div class="bar"><i style="width:${a.other/max*100}%;background:var(--other)"></i></div></div>
   <div class="tot"><span>Total invested</span><b>${rs(a.invested)}</b></div>`;
  $("#costs").innerHTML=a.ex.length?a.ex.map(e=>`<li><span><span class="d">${fmtDate(e.date,{day:"numeric",month:"short"})}</span>${esc(e.name)}</span><b>${rs(e.amount)}</b><button class="del" data-act="del-cost" data-id="${e.id}" aria-label="Delete ${esc(e.name)}">${ICON.trash}</button></li>`).join(""):`<li style="display:block" class="muted">No other costs in this period.</li>`;
  const el=$("#ana");
  if(!a.daily.length&&!a.ex.length){el.innerHTML=`<div class="empty"><p class="muted">No numbers in this period yet.</p><a class="btn primary" href="#home">Go to the daily sheet</a></div>`;return}
  const net=a.net,ng=net<0,best=[...a.daily].sort((x,y)=>y.v-x.v),lo=best[best.length-1],dl=x=>`Day ${dayNo(x.d)}, ${dshort(x.d)}`;
  const runs=[];a.mdays.map(dayNo).forEach(n=>{const r=runs[runs.length-1];r&&r[1]===n-1?r[1]=n:runs.push([n,n])});
  const dlist=(runs.length===1&&runs[0][0]===runs[0][1]?"Day ":"Days ")+runs.map(([x,y])=>x===y?x:`${x}–${y}`).join(", ");
  el.innerHTML=`<div class="big-p${ng?" neg":""}"><span>${ng?"Loss":"Profit"} · ${PER[S.per].toLowerCase()}</span><b>${money(net)}</b>
   <small>${rs(a.rev)} sales − ${rs(a.invested)} spent${a.mdays.length?` ${a.manual<0?"−":"+"} ${rs(a.manual)} from ${dlist} (profit only)`:""}</small></div>
   <div class="kpis2"><div class="kpi"><span>Total sales</span><b>${rs(a.rev)}</b></div><div class="kpi"><span>Total spent</span><b>${rs(a.invested)}</b></div></div>
   <h3>Profit each day</h3><div id="daily"></div>
   ${a.daily.length>1?`<ul class="bw"><li><span>Best day</span><b class="${best[0].v<0?"neg":"pos"}">${money(best[0].v)}</b><small>${dl(best[0])}</small></li><li><span>Toughest day</span><b class="${lo.v<0?"neg":"pos"}">${money(lo.v)}</b><small>${dl(lo)}</small></li></ul>`:""}`;
  S.series=a.daily;drawDaily()}
function drawDaily(){const el=$("#daily");if(!el||!S.series)return;const s=S.series,n=s.length;if(!n){el.innerHTML='<p class="muted">No stall days in this period.</p>';return}
  const W=Math.max(260,el.clientWidth),H=210,pt=22,pb=26,pl=28;let hi=Math.max(...s.map(x=>x.v),1),lo=Math.min(...s.map(x=>x.v),0);const sp=hi-lo;hi+=sp*.15;if(lo<0)lo-=sp*.22;
  const y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb),y0=y(0),step=(W-pl)/n,bw=Math.max(3,Math.min(40,step*.62)),showV=step>=34,every=Math.ceil(30/step);
  const f=v=>(v<0?"−":"+")+"₹"+(Math.abs(v)>=1000?(Math.abs(v)/1000).toFixed(1)+"k":Math.abs(v));let g="";
  s.forEach((x,i)=>{const cx=pl+step*i+step/2,ng=x.v<0,h=Math.max(2,Math.abs(y(x.v)-y0)),top=ng?y0:y0-h;
    g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(5,bw/3).toFixed(1)}" class="${ng?"b-neg":"b-pos"}"><title>${fmtDate(x.d,{day:"numeric",month:"short"})}: ${ng?"loss":"profit"} ${rs(x.v)}</title></rect>`;
    if(showV)g+=`<text x="${cx}" y="${ng?y0+h+13:top-6}" class="v ${ng?"t-neg":"t-pos"}">${f(x.v)}</text>`;
    if(i%every===0)g+=`<text x="${cx}" y="${H-7}" class="dl">${+x.d.slice(8)} ${fmtDate(x.d,{month:"short"})}</text>`});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Profit each day: ${s.map(x=>`${fmtDate(x.d,{day:"numeric",month:"short"})} ${x.v<0?"loss":"profit"} ${rs(x.v)}`).join("; ")}"><line x1="${pl-4}" x2="${W}" y1="${y0}" y2="${y0}" class="zero"/><text x="0" y="${y0+4}" class="z">₹0</text>${g}</svg>`}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.getAttribute("aria-disabled")==="true")return;
  ({logout:()=>{flush();store.del(K.session);S.session=null;D=null;REV=null;go()},reload:go,retry,
   per:()=>{S.per=b.dataset.per;$$("[data-per]").forEach(c=>c.setAttribute("aria-pressed",c===b));fillDash()},
   "del-day":()=>{const d=b.dataset.d,day=clone(D.days[d]);run("delDay",[d]);renderHome();
     toast(`<span>Cleared ${fmtDate(d,{day:"numeric",month:"long"})}.</span><button class="quiet" data-act="undo">Undo</button>`);S.undo=()=>{run("putDay",[d,day]);renderHome()}},
   "pk-edit":editPocket,"pk-cancel":()=>{$("#pkf").remove();fillPocket()},
   "del-cost":()=>{const c=D.expenses.find(x=>x.id===b.dataset.id);run("delCost",[c.id]);fillDash();
     toast(`<span>Removed “${esc(c.name)}”.</span><button class="quiet" data-act="undo">Undo</button>`);S.undo=()=>{run("addCost",[c]);fillDash()}},
   leave:()=>{const d=b.dataset.d;run("setLeave",[d,true]);renderHome();$(`tr[data-d="${d}"] [data-act=unleave]`)?.focus();
     toast(`<span>${fmtDate(d,{day:"numeric",month:"long"})} marked as leave.</span><button class="quiet" data-act="undo">Undo</button>`);S.undo=()=>{run("setLeave",[d,false]);renderHome()}},
   unleave:()=>{const d=b.dataset.d;run("setLeave",[d,false]);renderHome();$(`tr[data-d="${d}"] .cell`)?.focus()},
   undo:()=>{S.undo?.();S.undo=null;$("#toast").innerHTML=""}})[b.dataset.act]?.()});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
  if(f.id==="login")return onLogin(f);
  if(f.id==="pkf"){const v=f.v.value.replace(/\D/g,"");if(v===""){f.v.focus();return}const t=TODAY();
    run("setPocketFix",[{amount:+v,date:t,base:profitFrom(t),ob:otherFrom(t),by:S.session.name}]);f.remove();fillPocket();toast(`Money in pocket set to ${rs(+v)}.`,3000);return}
  if(f.id==="addc"){const n=f.n.value.trim(),a=+f.a.value,d=f.d.value,er=$("#ferr");
    const bad=!n?["Say what the money was for.",f.n]:!(a>0)?["Enter an amount above ₹0.",f.a]:!d||d>TODAY()?["Pick a date up to today.",f.d]:null;
    if(bad){er.hidden=false;er.textContent=bad[0];bad[1].focus();return}er.hidden=true;
    run("addCost",[{id:uid(),date:d,name:n,amount:a}]);f.n.value="";f.a.value="";fillDash();toast(`Added ${esc(n)} · ${rs(a)}.`,3000)}});
document.addEventListener("input",e=>{const i=e.target,f=i.dataset.f;
  if(f==="profit"){const neg=/^[\s₹]*[-−]/.test(i.value),n=i.value.replace(/\D/g,"").slice(0,6),v=(neg?"-":"")+n;if(v!==i.value)i.value=v;
    run("setProfit",[i.dataset.d,n===""?null:(neg?-1:1)*+n],i.dataset.d+"p");derive();return}
  if(i.classList.contains("cell")||i.hasAttribute("data-price")||i.name==="a"){const v=i.value.replace(/\D/g,"").slice(0,f==="cost"?6:4);if(v!==i.value)i.value=v}
  if(f==="cost"){run("setCost",[i.dataset.d,i.value===""?null:+i.value],i.dataset.d+"c");derive();return}
  if(f==="price"){run("setPrice",[i.dataset.k,"price",+i.value||0,TODAY()],"p"+i.dataset.k);derive();return}
  if(i.classList.contains("cell")){const{d,k}=i.dataset;run("setCell",[d,k,f,+i.value||0],d+k+f);derive()}});
/* first keystroke after focusing a box replaces its number (like a spreadsheet) */
document.addEventListener("focusin",e=>{const i=e.target;if(!i.matches?.(".cell,[data-price]"))return;i.dataset.fresh=1;setTimeout(()=>{if(i.dataset.fresh)try{i.setSelectionRange(0,9)}catch(x){}},0)});
document.addEventListener("click",e=>{const i=e.target;if(i.matches?.(".cell,[data-price]")&&!i.dataset.fresh){i.dataset.fresh=1;try{i.setSelectionRange(0,9)}catch(x){}}});
document.addEventListener("mouseup",e=>{const i=e.target;if(i.dataset?.fresh&&i.matches(".cell,[data-price]"))e.preventDefault()});
/* we put the first key in ourselves: changing the box and leaving the key to the browser made some Firefox builds drop it */
document.addEventListener("beforeinput",e=>{const i=e.target;if(!i.dataset?.fresh)return;delete i.dataset.fresh;const t=e.inputType||"";
  if(!e.cancelable||!((t==="insertText"&&e.data!=null)||t.startsWith("delete")))return;
  e.preventDefault();i.value=t==="insertText"?e.data:"";try{i.setSelectionRange(i.value.length,i.value.length)}catch(x){}i.dispatchEvent(new Event("input",{bubbles:true}))});
document.addEventListener("focusout",e=>{const i=e.target;if(i.dataset?.fresh)delete i.dataset.fresh;if((i.dataset?.f==="profit"||i.dataset?.f==="cost")&&$("#foot"))derive();if(i.hasAttribute?.("data-price")&&i.value==="")i.value="0"});
document.addEventListener("keydown",e=>{const i=e.target;if(!i.classList?.contains("cell"))return;
  if(e.key==="Enter"){e.preventDefault();const all=$$(".cell"),n=all[all.indexOf(i)+(e.shiftKey?-1:1)];n?n.focus():i.blur();return}
  const dir=e.key==="ArrowDown"?1:e.key==="ArrowUp"?-1:0;if(!dir)return;e.preventDefault();
  const col=$$(i.dataset.k?`.cell[data-k="${i.dataset.k}"][data-f="${i.dataset.f}"]`:`.cell[data-f="${i.dataset.f}"]`),n=col[col.indexOf(i)+dir];n?.focus()});
addEventListener("hashchange",()=>{if(S.session&&D)route()});
addEventListener("resize",()=>{if(S.page==="dashboard")requestAnimationFrame(drawDaily)});
/* after leaving a box, pick up anything the other person changed meanwhile */
document.addEventListener("focusout",()=>setTimeout(()=>{if(!document.activeElement?.matches?.("input,select,textarea"))poll()},500));
go();
</script>
