[build]
  publish = "."
  functions = "netlify/functions"

# keep the server code and setup files from being served as pages
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
